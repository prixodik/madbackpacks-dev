<style>
	body,
	html {
		background: #090923;
		width: 100%;
		height: 100%;
		display: flex;
		justify-content: center;
		align-items: center;
		margin: 0;
		padding: 0;
	}

	.loading-page {
		position: fixed;
		top: 0;
		right: 0;
		z-index: 1000;
		width: 100%;
		height: 100%;
		display: flex;
		align-items: center;
		justify-content: center;
		background: #090923;
		pointer-events: none;
		opacity: 0;
		transition: all .5s;
	}

	.loading-page.is-active {
		opacity: 1;
		pointer-events: auto;
	}


	.loading {
		display: flex;
		justify-content: center;
		align-items: center;
		width: 300px;
		height: 300px;
		position: relative;
		z-index: 1;
	}

	.loading__main {
		/* width: 70px;
	height: 70px; */
		object-fit: contain;
		display: block;
		animation: spin 3s ease-in-out infinite;
		transform-origin: 50% 50%;

		/* position: absolute;
		top: 50%;
		left: 50%;
		z-index: 2;
		transform: translate(-50%, -50%); */
	}

	.loading__main img {
		max-width: 100%;
		object-fit: contain;
	}

	.loading__circle {
		width: 200px;
		height: 200px;
		object-fit: contain;
		display: block;
		animation: spin 1s ease-in-out infinite;
		transform-origin: 0% 0%;
		position: absolute;
		top: 50%;
		left: 50%;
		z-index: -1;
		transform: translate(-50%, -50%);
	}

	@keyframes spin {
		0% {
			-webkit-transform: rotate(0deg) scale(1);
			transform: rotate(0deg) scale(1);
		}

		50% {
			-webkit-transform: rotate(0deg) scale(0.96);
			transform: rotate(0deg) scale(0.96);
		}

		100% {
			-webkit-transform: rotate(0deg) scale(1);
			transform: rotate(0deg) scale(1);
		}
	}
</style>

<div class="loading-page is-active">
	<div data-v-10c0ae51="" class="loading">
		<picture data-v-10c0ae51="" class="loading__main">
			<source srcset="/images/logo.webp,
		/images/logo@2x.webp 2x" type="image/webp">
			<source srcset="/images/logo.png" type="image/png"> <img src="/images/logo.png" alt="">
		</picture>
	</div>
</div>
